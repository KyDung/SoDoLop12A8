<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Khóa bố cục như máy tính: điện thoại hiển thị đúng 1312px rồi tự thu nhỏ vừa màn hình, người dùng zoom để xem rõ -->
<meta name="viewport" content="width=1312">
<title>Sơ đồ lớp 12A8</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue-deep:#1f5c99;
    --blue-dark:#17497a;
    --blue-border:#2e5f8a;
    --cell-bg:#ddeefb;
    --cell-bg2:#eaf5fe;
    --orange:#f8b183;
    --orange-border:#d96c1f;
    --ink:#1b2733;
    --muted:#6b7b8c;
    --page:#eef3f8;
    --panel:#ffffff;
    --line:#d7e2ec;
    --gap:26px;   /* khoảng cách giữa các dãy */
    --ng:3;       /* số dãy — JS ghi đè theo dữ liệu */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:20px 16px 48px;
    min-width:1312px;
  }

  .wrap{width:1280px;margin:0 auto}

  /* ---------- Thanh điều khiển ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,40,60,.06);
  }
  .seg{display:flex;background:#e9eff6;border-radius:9px;padding:3px;gap:3px}
  .seg button{
    border:0;background:transparent;color:var(--muted);
    font:600 14px/1 inherit;padding:9px 16px;border-radius:7px;cursor:pointer;
  }
  .seg button.on{background:var(--blue-deep);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    font:600 14px/1 inherit;padding:10px 15px;border-radius:9px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  }
  .btn:hover{background:#f4f8fc;border-color:#b9cbdc}
  .btn.primary{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}
  .btn.primary:hover{background:var(--blue-dark)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .spacer{flex:1 1 auto}
  .status{font-size:13px;color:var(--muted);white-space:nowrap}
  .status.err{color:#c0392b;font-weight:600;white-space:normal}

  /* ---------- Khung sơ đồ (vùng được xuất ảnh/PDF) ---------- */
  .board{
    background:#fff;border-radius:10px;padding:26px 26px 30px;
    box-shadow:0 2px 10px rgba(20,40,60,.08);
  }
  .board-title{
    background:var(--blue-deep);color:#fff;border-radius:10px;
    font-size:40px;font-weight:800;letter-spacing:.5px;
    text-align:center;padding:14px 10px;margin:0 0 6px;
  }
  .desk-row{display:flex;margin:14px 0}
  .desk-row.right{justify-content:flex-end}
  .desk-row.center{justify-content:center}
  .desk-row.left{justify-content:flex-start}
  /* Bàn giáo viên rộng đúng bằng 1 dãy bàn nên luôn thẳng mép với lưới */
  .desk{
    background:var(--orange);border:2px solid var(--orange-border);
    color:#1b2733;font-weight:800;letter-spacing:.5px;
    font-size:20px;
    padding:14px 10px;text-align:center;
    width:calc((100% - (var(--ng) - 1) * var(--gap)) / var(--ng));
    box-sizing:border-box;
  }

  .rows{display:flex;gap:var(--gap);align-items:stretch;flex-wrap:nowrap}
  /* Mỗi dãy nằm trong 1 wrapper — wrapper mới là flex item, phải chia đều ở đây */
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  .group{
    flex:1 1 auto;
    border:2px solid var(--blue-border);
    display:flex;flex-direction:column;
  }
  /* flex:1 để khi 1 dãy cao hơn (tên bị xuống dòng) thì các dãy khác giãn đều theo,
     mép dưới của cả 3 dãy luôn thẳng hàng */
  .grow{display:flex;flex:1 1 auto}
  .grow + .grow{border-top:2px solid var(--blue-border)}
  .seat{
    flex:1 1 0;min-width:0;
    padding:10px 8px;text-align:center;
    background:var(--cell-bg);
    font-size:15.5px;line-height:1.3;
    display:flex;align-items:center;justify-content:center;
    word-break:break-word;
    /* Khóa chiều cao = đúng 2 dòng chữ: mọi ô bằng nhau dù tên ngắn hay dài (tối đa 2 dòng) */
    height:calc(2.6em + 20px);overflow:hidden;
  }
  .seat .nm{display:block;max-height:2.6em;overflow:hidden}
  .seat + .seat{border-left:2px solid var(--blue-border)}
  .seat.empty{background:#f4f6f8}
  .group-label{
    text-align:center;font-size:12px;font-weight:700;color:var(--muted);
    padding:6px 0 0;letter-spacing:.4px;
  }

  /* ---------- Kéo thả đổi chỗ ---------- */
  .seat{position:relative;cursor:grab;-webkit-user-select:none;user-select:none;
        -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .seat.pressing{background:#cfe4f7;transition:background .15s}
  .seat.dragging{opacity:.35}
  .seat.target{background:#ffe9a8 !important;outline:3px solid var(--orange-border);outline-offset:-3px;z-index:1}
  .ghost{
    position:fixed;z-index:9999;pointer-events:none;
    background:var(--orange);border:2px solid var(--orange-border);border-radius:8px;
    padding:10px 14px;font-weight:700;font-size:15px;max-width:60vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translate(-50%,-120%);
  }
  body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
  .hint{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2733;color:#fff;
    padding:10px 16px;border-radius:9px;font-size:14px;z-index:10000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}

  .legend{
    margin-top:16px;font-size:13px;color:var(--muted);text-align:center;
  }

</style>
</head>
<body>
<div class="wrap">

  <div class="toolbar">
    <div class="seg" role="tablist">
      <button id="btnHS" class="on" onclick="setView('hs')">👩‍🎓 Góc nhìn học sinh</button>
      <button id="btnGV" onclick="setView('gv')">🧑‍🏫 Góc nhìn giáo viên</button>
    </div>
    <button class="btn" id="btnUndo" onclick="undoSwap()" disabled>↩️ Hoàn tác</button>
    <button class="btn" id="btnPng" onclick="exportPNG()">🖼️ Tải ảnh PNG</button>
    <button class="btn primary" id="btnPdf" onclick="exportPDF()">📄 Tải PDF</button>
    <div class="spacer"></div>
    <div class="status" id="status">Đang tải…</div>
  </div>

  <div class="board" id="board">
    <h1 class="board-title" id="title">SƠ ĐỒ LỚP 12A8</h1>
    <div class="desk-row" id="deskTop"><div class="desk">BÀN GIÁO VIÊN</div></div>
    <div class="rows" id="rows"></div>
    <div class="desk-row" id="deskBottom"><div class="desk">BÀN GIÁO VIÊN</div></div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="hint">👆 <b>Kéo thả</b> học sinh sang ô khác để đổi chỗ (điện thoại: giữ ~0,3 giây rồi kéo). <b>Chạm hai lần</b> (điện thoại: chạm một lần) vào ô để sửa tên. Mọi thay đổi tự lưu lên Firebase và mọi người thấy ngay.</div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =======================================================================
   CẤU HÌNH — dữ liệu sơ đồ lưu trên Firebase (Firestore, collection "sodolop12a8").
   Project dùng chung "linhtinh"; chỉ đụng tới collection này.
   ======================================================================= */
const CONFIG = {
  TITLE: "SƠ ĐỒ LỚP 12A8",
  DESK:  "Trên - Phải",   // vị trí bàn giáo viên mặc định (góc nhìn học sinh)
  FIREBASE: {
    apiKey: "AIzaSyDHih6wE80pV37NnT82-Df-xr3lirtI7ms",
    authDomain: "linhtinh-web-2026.firebaseapp.com",
    projectId: "linhtinh-web-2026",
    storageBucket: "linhtinh-web-2026.firebasestorage.app",
    messagingSenderId: "75434824568",
    appId: "1:75434824568:web:9ce3313658f3ce36a4ae8d"
  }
};

/* Sơ đồ mặc định: chỉ dùng khi Firebase chưa có dữ liệu (lần đầu) hoặc mất kết nối.
   Cấu trúc: [dãy][hàng][chỗ A, chỗ B] — góc nhìn học sinh. */
const DEFAULT_GROUPS = [
  [["Nguyễn Thị Hoài Anh","Đỗ Trí Thiện"],["Phùng Quốc Việt","Nguyễn Trần Bảo Chi"],["Trần Mạnh Quang","Nguyễn Phạm Mai Anh"],
   ["Trần Đăng Khôi","Hoàng Thùy Ngân"],["Lê Bảo Anh","Đào Anh Vũ"]],
  [["Phạm Hải Đăng","Phan Duy Thuận"],["Trần Phương Linh","Phạm Quỳnh Chi"],["Nguyễn Phương Minh Tuệ","Lưu Nguyễn Minh Châu"],
   ["Phạm Phú Thái","Nguyễn Thị Phương Linh"],["Nguyễn Khánh Linh","Lê Anh Thư"]],
  [["Đỗ Tiến Quân","Nguyễn Ngọc Khánh Linh"],["Nguyễn Thùy Linh","Vũ Đăng Trình"],["Đỗ Nguyễn Kim Ngân","Lê Phương Linh"],
   ["Vũ Hoàng Quế Anh","Nguyễn Thị Thanh Ngân"],["Nguyễn Thị Hoài An","Phùng Duy Anh"],["Lê Sỹ Bách",""]]
];

/* ----------------------------------------------------------------- */
// Mở sẵn 1 góc nhìn qua URL: ...index.html?view=gv
let view = /^(gv|giaovien|teacher)$/i.test(
             new URLSearchParams(location.search).get("view") || "") ? "gv" : "hs";
let groups = [];            // [ [ [seatA,seatB], ... hàng ... ], ... dãy ... ]
let deskPos = CONFIG.DESK;  // vị trí bàn giáo viên theo góc nhìn học sinh
let usingFallback = false;

const $ = id => document.getElementById(id);

/* --------------------------- Dữ liệu: Firebase --------------------------- */
const COL = "sodolop12a8";
let db = null, layoutRef = null, unsub = null, seeding = false, history = [];

const stateJson = () => JSON.stringify({ v: 1, groups, desk: deskPos });
function applyJson(str){
  const o = JSON.parse(str);
  if (!Array.isArray(o.groups)) throw new Error("dữ liệu lỗi");
  groups = o.groups; deskPos = o.desk || CONFIG.DESK;
}
const timeStr = () => new Date().toLocaleTimeString("vi-VN");

async function saveState(){
  if (!layoutRef) return;
  setStatus("💾 Đang lưu…");
  try{
    await layoutRef.set({ data: stateJson(), updatedAt: Date.now() });
    setStatus("☁️ Đã lưu lúc " + timeStr());
  }catch(err){
    setStatus("⚠️ Không lưu được lên Firebase: " + err.message, true);
  }
}
function pushHistory(){
  history.push(stateJson());
  if (history.length > 50) history.shift();
}

const cloneDefault = () => {   // các dãy phải có cùng số hàng (để xoay góc nhìn giáo viên đúng)
  const n = Math.max(...DEFAULT_GROUPS.map(g => g.length));
  return DEFAULT_GROUPS.map(g => {
    const c = g.map(seat => seat.slice());
    while (c.length < n) c.push(["", ""]);
    return c;
  });
};

/* Lần đầu tiên (chưa có gì trên Firebase): ghi sơ đồ mặc định lên */
async function seedDefault(){
  groups = cloneDefault(); deskPos = CONFIG.DESK;
  usingFallback = false; history = [];
  render();
  await saveState();
}

async function loadData(){
  setStatus("Đang kết nối Firebase…");
  try{
    if (!window.firebase) throw new Error("không tải được thư viện Firebase");
    if (!firebase.apps.length) firebase.initializeApp(CONFIG.FIREBASE);
    db = firebase.firestore();
    layoutRef = db.collection(COL).doc("layout");
  }catch(err){
    return offlineFallback(err.message);
  }
  if (unsub) unsub();
  // Theo dõi realtime: máy khác sửa là máy này tự cập nhật
  unsub = layoutRef.onSnapshot(snap => {
    if (snap.exists){
      try{
        applyJson(snap.data().data);
        usingFallback = false;
        if (!document.body.classList.contains("is-dragging")) render();
        if (!snap.metadata.hasPendingWrites) setStatus("☁️ Đồng bộ lúc " + timeStr());
      }catch(e){ setStatus("⚠️ Dữ liệu Firebase lỗi: " + e.message, true); }
    } else if (!snap.metadata.fromCache && !seeding){
      seeding = true;
      seedDefault().finally(() => { seeding = false; });
    }
  }, err => offlineFallback(err.message));
}

/* Không kết nối được Firebase: hiển thị sơ đồ mặc định, chỉ xem */
function offlineFallback(msg){
  layoutRef = null;
  groups = cloneDefault(); deskPos = CONFIG.DESK;
  usingFallback = true;
  render();
  setStatus("⚠️ Không kết nối được Firebase (" + msg + "). Đang xem dữ liệu dự phòng, mọi chỉnh sửa sẽ KHÔNG được lưu.", true);
}

/* Bỏ dấu tiếng Việt để so khớp không phụ thuộc cách gõ */
function noAccent(s){
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "")
                  .replace(/đ/gi, "d").toLowerCase();
}

/* "Trên - Phải" -> {v:"top", h:"right"}; góc nhìn giáo viên xoay 180° cả 2 trục */
function deskLayout(){
  const s = noAccent(deskPos);
  let v = /(duoi|bottom|sau|cuoi)/.test(s) ? "bottom" : "top";
  let h = /(phai|right)/.test(s) ? "right"
        : /(trai|left)/.test(s)  ? "left"
        : "center";
  if (view === "gv"){
    v = v === "top" ? "bottom" : "top";
    h = h === "right" ? "left" : h === "left" ? "right" : "center";
  }
  return { v, h };
}

/* --------------------------- Hiển thị --------------------------- */
function setView(v){
  view = v;
  $("btnHS").classList.toggle("on", v === "hs");
  $("btnGV").classList.toggle("on", v === "gv");
  render();
}

/* Góc nhìn giáo viên = xoay 180°: đảo thứ tự dãy, đảo hàng, đảo 2 chỗ trong mỗi bàn */
function viewData(){
  if (view === "hs") return groups;
  return groups.slice().reverse()
    .map(g => g.slice().reverse().map(seat => seat.slice().reverse()));
}

function render(){
  $("title").textContent = CONFIG.TITLE;
  const data = viewData();
  const nGroups = groups.length;

  // Bàn giáo viên: đặt trên/dưới lưới và canh trái/giữa/phải theo cấu hình đã lưu
  const d = deskLayout();
  const top = $("deskTop"), bottom = $("deskBottom");
  top.style.display    = d.v === "top"    ? "" : "none";
  bottom.style.display = d.v === "bottom" ? "" : "none";
  top.className = bottom.className = "desk-row " + d.h;

  $("rows").innerHTML = data.map((g, gi) => {
    // nhãn dãy theo đánh số gốc (góc nhìn học sinh)
    const label = "Dãy " + (view === "hs" ? gi + 1 : nGroups - gi);
    const og = view === "hs" ? gi : nGroups - 1 - gi;   // chỉ số dãy gốc
    const body = g.map((seat, ri) => {
      const or = view === "hs" ? ri : g.length - 1 - ri;
      return `<div class="grow">` +
      seat.map((name, si) => {
        const os = view === "hs" ? si : seat.length - 1 - si;
        return `<div class="seat${name ? "" : " empty"}" data-g="${og}" data-r="${or}" data-s="${os}"><span class="nm">${escapeHtml(name)}</span></div>`;
      }).join("") +
      `</div>`;
    }).join("");
    return `<div class="col"><div class="group">${body}</div><div class="group-label">${label}</div></div>`;
  }).join("");

  // Bàn giáo viên rộng đúng 1 dãy: cần biết tổng số dãy
  $("board").style.setProperty("--ng", Math.max(1, nGroups));

  const total = groups.flat(2).filter(Boolean).length;
  $("legend").textContent =
    (view === "hs"
      ? "Góc nhìn học sinh — nhìn từ chỗ ngồi hướng lên bảng."
      : "Góc nhìn giáo viên — nhìn từ bục giảng xuống lớp (tự động xoay 180°).")
    + `  •  Tổng số học sinh: ${total}`
    + `  •  Bàn giáo viên: ${deskLabel()}`
    + (usingFallback ? "  •  (dữ liệu mẫu)" : "");
  $("btnUndo").disabled = history.length === 0;
}

function deskLabel(){
  const d = deskLayout();
  const v = d.v === "top" ? "phía trên" : "phía dưới";
  const h = d.h === "left" ? "bên trái" : d.h === "right" ? "bên phải" : "ở giữa";
  return `${v}, ${h}`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function setStatus(msg, isErr){
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}

/* --------------------------- Xuất ảnh / PDF --------------------------- */
function fileName(ext){
  const v = view === "hs" ? "HocSinh" : "GiaoVien";
  const d = new Date().toISOString().slice(0,10);
  return `SoDoLop12A8-${v}-${d}.${ext}`;
}

async function capture(){
  // Khóa cứng bố cục: luôn dựng như màn hình máy tính rộng EXPORT_W px,
  // bất kể thiết bị -> ảnh/PDF trên điện thoại giống hệt trên máy tính.
  const EXPORT_W = 1280;
  return await html2canvas($("board"), {
    scale: 2,
    backgroundColor: "#ffffff",
    useCORS: true,
    logging: false,
    windowWidth: EXPORT_W + 80,
    width: EXPORT_W,
    scrollX: 0, scrollY: 0,
    onclone: (doc) => {
      const b = doc.getElementById("board");
      doc.body.style.padding = "0";
      doc.body.style.margin = "0";
      const w = doc.querySelector(".wrap");
      w.style.maxWidth = "none"; w.style.margin = "0"; w.style.width = EXPORT_W + "px";
      b.style.width = EXPORT_W + "px"; b.style.maxWidth = "none"; b.style.margin = "0";
      b.style.boxShadow = "none"; b.style.borderRadius = "0";
      b.style.padding = "26px 26px 30px";
      doc.querySelectorAll(".seat").forEach(e => e.classList.remove("target","dragging","pressing"));
      doc.querySelectorAll(".ghost").forEach(e => e.remove());
    }
  });
}

async function exportPNG(){
  const btn = $("btnPng"); btn.disabled = true; const t = btn.textContent;
  btn.textContent = "Đang tạo ảnh…";
  try{
    const canvas = await capture();
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = fileName("png");
    a.click();
  }catch(e){ alert("Không tạo được ảnh: " + e.message); }
  finally{ btn.disabled = false; btn.textContent = t; }
}

async function exportPDF(){
  const btn = $("btnPdf"); btn.disabled = true; const t = btn.textContent;
  btn.textContent = "Đang tạo PDF…";
  try{
    const canvas = await capture();
    const img = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    // Luôn khổ A4 ngang, căn giữa, giữ nguyên tỉ lệ -> in ra đồng nhất trên mọi thiết bị
    const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const m = 8;
    const ratio = Math.min((pw - m*2) / canvas.width, (ph - m*2) / canvas.height);
    const w = canvas.width * ratio, h = canvas.height * ratio;
    pdf.addImage(img, "PNG", (pw - w) / 2, (ph - h) / 2, w, h);
    pdf.save(fileName("pdf"));
  }catch(e){ alert("Không tạo được PDF: " + e.message); }
  finally{ btn.disabled = false; btn.textContent = t; }
}


/* --------------------------- Đổi chỗ / sửa tên (lưu thẳng lên Firebase) --------------------------- */
function doSwap(a, b){
  const sa = groups[a[0]] && groups[a[0]][a[1]], sb = groups[b[0]] && groups[b[0]][b[1]];
  if (!sa || !sb || sa[a[2]] === undefined || sb[b[2]] === undefined) return false;
  const t = sa[a[2]]; sa[a[2]] = sb[b[2]]; sb[b[2]] = t;
  return true;
}
function undoSwap(){
  const prev = history.pop();
  if (!prev) return;
  applyJson(prev); render(); saveState(); toast("Đã hoàn tác");
}
function editSeat(el){
  if (!layoutRef) return alert("Chưa kết nối Firebase nên không sửa được.");
  const g = +el.dataset.g, r = +el.dataset.r, si = +el.dataset.s;
  const cur = groups[g][r][si] || "";
  const v = prompt("Sửa tên học sinh ở ô này\n(để trống = bỏ trống ô):", cur);
  if (v === null) return;
  const name = v.trim().replace(/\s+/g, " ");
  if (name === cur) return;
  pushHistory();
  groups[g][r][si] = name;
  render(); saveState();
}
/* Trang bị thu nhỏ trên điện thoại -> phóng to nhãn kéo/thông báo bù lại để vẫn đọc được */
function uiScale(){
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  return Math.max(1, (screen.width || vw) / vw);
}
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.fontSize = (14 * uiScale()) + "px"; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

(function setupDrag(){
  const board = $("board");
  const HOLD_MS = 300, MOVE_PX = 6;
  let st = null;
  let scrollRAF = 0, lastX = 0, lastY = 0;

  const coord = el => [+el.dataset.g, +el.dataset.r, +el.dataset.s];
  const clear = () => document.querySelectorAll(".seat.target").forEach(e => e.classList.remove("target"));

  function begin(){
    if (!st || st.active) return;
    st.active = true;
    st.el.classList.remove("pressing");
    st.el.classList.add("dragging");
    document.body.classList.add("is-dragging");
    const g = document.createElement("div");
    g.className = "ghost";
    g.textContent = st.el.textContent.trim() || "(ô trống)";
    g.style.fontSize = (15 * uiScale()) + "px";
    document.body.appendChild(g);
    st.ghost = g;
    if (navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
    move(lastX, lastY);
    autoScroll();
  }
  function move(x, y){
    if (!st || !st.active) return;
    st.ghost.style.left = x + "px"; st.ghost.style.top = y + "px";
    const t = document.elementFromPoint(x, y);
    const over = t && t.closest ? t.closest(".seat") : null;
    clear();
    st.over = over && over !== st.el && board.contains(over) ? over : null;
    if (st.over) st.over.classList.add("target");
  }
  function autoScroll(){
    cancelAnimationFrame(scrollRAF);
    const loop = () => {
      if (!st || !st.active) return;
      const edge = 70, h = window.innerHeight;
      let dy = 0;
      if (lastY < edge) dy = -Math.ceil((edge - lastY) / 5);
      else if (lastY > h - edge) dy = Math.ceil((lastY - (h - edge)) / 5);
      if (dy){ window.scrollBy(0, dy); move(lastX, lastY); }
      scrollRAF = requestAnimationFrame(loop);
    };
    scrollRAF = requestAnimationFrame(loop);
  }
  function end(drop){
    if (!st) return;
    clearTimeout(st.timer);
    cancelAnimationFrame(scrollRAF);
    const s = st; st = null;
    s.el.classList.remove("pressing","dragging");
    document.body.classList.remove("is-dragging");
    if (s.ghost) s.ghost.remove();
    clear();
    if (s.active && drop && s.over){
      const a = coord(s.el), b = coord(s.over);
      if (!layoutRef){ alert("Chưa kết nối Firebase nên không đổi chỗ được."); return; }
      pushHistory();
      if (doSwap(a, b)){
        render(); saveState();
        toast("Đã đổi chỗ");
      }
    } else if (s.active) render();   // thả ra ngoài: dựng lại (có thể đã nhận dữ liệu mới khi đang kéo)
  }

  board.addEventListener("pointerdown", e => {
    const el = e.target.closest(".seat");
    if (!el || st || (e.pointerType === "mouse" && e.button !== 0)) return;
    const touch = e.pointerType !== "mouse";
    st = { el, id: e.pointerId, x0: e.clientX, y0: e.clientY, touch, active: false };
    lastX = e.clientX; lastY = e.clientY;
    if (touch){
      // chạm: giữ lâu mới kéo, để vuốt nhanh vẫn cuộn trang bình thường
      el.classList.add("pressing");
      st.timer = setTimeout(begin, HOLD_MS);
    }
  });
  window.addEventListener("pointermove", e => {
    if (!st || e.pointerId !== st.id) return;
    lastX = e.clientX; lastY = e.clientY;
    if (!st.active){
      const moved = Math.hypot(e.clientX - st.x0, e.clientY - st.y0);
      if (st.touch){ if (moved > 10) end(false); }
      else if (moved > MOVE_PX) begin();
      return;
    }
    e.preventDefault();
    move(e.clientX, e.clientY);
  });
  window.addEventListener("pointerup", e => {
    if (!st || e.pointerId !== st.id) return;
    const tap = st.touch && !st.active, el = st.el;   // chạm nhanh trên điện thoại = sửa tên
    end(true);
    if (tap) editSeat(el);
  });
  board.addEventListener("dblclick", e => {            // máy tính: bấm đúp = sửa tên
    const el = e.target.closest(".seat");
    if (el) editSeat(el);
  });
  window.addEventListener("pointercancel", e => { if (st && e.pointerId === st.id) end(false); });
  // Đang kéo trên điện thoại: chặn trình duyệt cuộn trang
  window.addEventListener("touchmove", e => { if (st && st.active) e.preventDefault(); }, {passive:false});
  board.addEventListener("contextmenu", e => { if (e.target.closest(".seat")) e.preventDefault(); });
  board.addEventListener("dragstart", e => e.preventDefault());
})();

/* --------------------------- Khởi động --------------------------- */
$("btnHS").classList.toggle("on", view === "hs");
$("btnGV").classList.toggle("on", view === "gv");
loadData();
</script>
